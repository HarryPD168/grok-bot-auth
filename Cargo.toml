[package]
name = "grok-bot-auth"
version = "0.4.21"
edition = "2021"
publish = false
description = "Standalone Grok Bot sand gateway (Rust). Not cursor-byok."
default-run = "grok-bot-auth"

[dependencies]
axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
bytes = "1"
eframe = { version = "0.32", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.32"
dirs = "6"
flate2 = "1"
futures-util = "0.3"
http-body-util = "0.1"
hudsucker = { version = "0.25", features = ["http2"] }
json5 = "0.4"
prost = "0.13"
prost-types = "0.13"
rcgen = { version = "0.14", features = ["aws_lc_rs", "pem"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "sync", "time", "process"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
tray-icon = "0.21"
rusqlite = { version = "0.32", features = ["bundled"] }

[[bin]]
name = "grok-bot-auth"
path = "src/main.rs"

[[bin]]
name = "probe-chat"
path = "src/bin/probe_chat.rs"
